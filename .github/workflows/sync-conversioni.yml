# Chiama ogni ora l'endpoint di sincronizzazione delle conversioni su Vercel.
#
# DAL 21 OTTOBRE 2026 QUESTA NON E' PIU' LA SVEGLIA PRINCIPALE, e' la seconda
# di tre. Qui i cron schedulati partono quando GitHub puo': misurato sui sette
# giorni precedenti, 46 giri su 168 attesi (27%), intervallo medio 216 minuti
# invece di 60, buco piu' lungo sette ore, quaranta buchi sopra le due. Alle 9
# e alle 17 non e' partita mai in una settimana. Non si perdeva nessun dato -
# la finestra riparte dall'ultima esecuzione RIUSCITA - ma si perdeva
# freschezza, fino a sette ore.
#
# La sveglia vera adesso e' QStash, che chiama lo stesso indirizzo ogni ora e
# riprova da solo: vedi dashboard-app/scripts/qstash-sincronizzazione.ts.
#
# QUESTA RESTA LO STESSO, e costa zero: se QStash ha un disservizio, qui o nel
# cron giornaliero di Vercel qualcuno prima o poi passa. Chi arriva per primo
# sincronizza, gli altri trovano poco da fare.
#
# PERCHE' NON SU VERCEL: il piano Hobby consente cron al massimo GIORNALIERI
# ("Hobby accounts are limited to cron jobs that run once per day"), e una
# schedulazione oraria fa addirittura fallire il deploy.
#
# SEGRETI DA IMPOSTARE (Settings -> Secrets and variables -> Actions):
#   DASHBOARD_URL  es. https://dashboard-xxxx.vercel.app   (senza barra finale)
#   CRON_SECRET    lo stesso valore impostato fra le variabili d'ambiente su Vercel

name: Sincronizza conversioni campagne

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # permette di lanciarla a mano dalla scheda Actions

concurrency:
  group: sync-conversioni
  cancel-in-progress: false

jobs:
  sincronizza:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chiama l'endpoint di sincronizzazione
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.DASHBOARD_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::Mancano i segreti DASHBOARD_URL o CRON_SECRET"
            exit 1
          fi

          corpo=$(mktemp)
          codice=$(curl -sS --max-time 120 -o "$corpo" -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.DASHBOARD_URL }}/api/cron/campaign-conversions-incremental")

          echo "HTTP $codice"
          cat "$corpo"
          echo

          if [ "$codice" != "200" ]; then
            echo "::error::Sincronizzazione fallita con HTTP $codice"
            exit 1
          fi
